# Builds Sovare HQ for macOS (universal: Apple Silicon + Intel) on a GitHub macOS runner.
# Every run uploads the build as an artifact and publishes/updates the GitHub Release
# v<package.json version> with Sovare-HQ.dmg (used by scripts/install.sh).
# Triggers: pushes to the app branch (code changes), tags v*, or Actions → "Build macOS app" → Run workflow.
name: Build macOS app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [claude/wonderful-johnson-ysh44e]
    paths-ignore: ["**/*.md", "docs/**"]
concurrency:
  group: macos-release
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - run: npm ci
      - run: npm run check
      - name: Build universal .app and .dmg (ad-hoc signed)
        run: npx tauri build --target universal-apple-darwin
      - name: Rust tests
        run: cargo test --target aarch64-apple-darwin
        working-directory: src-tauri
      - name: Collect release files
        run: |
          set -euo pipefail
          B=src-tauri/target/universal-apple-darwin/release/bundle
          mkdir -p out
          cp "$B"/dmg/*.dmg out/Sovare-HQ.dmg
          ditto -c -k --keepParent "$B/macos/Sovare HQ.app" out/Sovare-HQ.app.zip
          codesign --verify --deep --verbose=2 "$B/macos/Sovare HQ.app"
          lipo -info "$B/macos/Sovare HQ.app/Contents/MacOS/sovare-hq"
          (cd out && shasum -a 256 Sovare-HQ.dmg Sovare-HQ.app.zip > SHA256SUMS.txt)
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: sovare-hq-macos
          path: out/
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/Sovare-HQ.dmg out/Sovare-HQ.app.zip out/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" out/Sovare-HQ.dmg out/Sovare-HQ.app.zip out/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Sovare HQ ${TAG#v}" --notes-file .github/RELEASE_NOTES.md --latest
          fi
